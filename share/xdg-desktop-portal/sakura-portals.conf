# Script function and purpose: Tell xdg-desktop-portal which backend implements
# each portal interface for this desktop, so that screen sharing, screenshots
# and file dialogs keep working now that XDG_CURRENT_DESKTOP is the single name
# "Sakura".
#
# Why this file has to exist at all:
#
# Before it, the backend was chosen by name matching. xdg-desktop-portal-wlr
# ships a portal file listing the desktops it is willing to serve:
#
#     UseIn=wlroots;sway;Wayfire;river;phosh;Hyprland;
#
# No Sakura name appears in that list, which is why XDG_CURRENT_DESKTOP used to
# carry a trailing ":wlroots" -- not as an identity, but purely so this match
# would succeed. That worked, at the cost of every system-info tool reporting
# the desktop as "Hikari Sakura:wlroots", since those read the variable
# verbatim.
#
# Naming the backends here replaces the match entirely: selection no longer
# depends on what XDG_CURRENT_DESKTOP happens to contain, so the variable is
# free to be just "Sakura". Removing the suffix WITHOUT this file would leave
# nothing matching UseIn= and screen sharing would silently find no provider --
# no error is logged anywhere when that happens, which is precisely why the two
# changes belong together and must never be split apart.
#
# The filename is not arbitrary: xdg-desktop-portal looks for
# "$XDG_CURRENT_DESKTOP-portals.conf", lower-cased. It is therefore coupled to
# DesktopNames=Sakura in both wayland-sessions entries and to the
# XDG_CURRENT_DESKTOP default set by the compositor. Rename one and all four
# must change together.
#
# Requires xdg-desktop-portal 1.17.1 or newer. portals.conf itself arrived in
# 1.17.0, but 1.17.0 looks for it only in $XDG_CONFIG_HOME and its own
# build-time sysconfdir; the search of $XDG_DATA_DIRS and datadir, which is
# where this file is installed, came in 1.17.1. Below that floor this file is
# never opened, so selection falls back to the UseIn= match described above and
# screen sharing finds no provider.
#
# The same search is why this file's directory matters as much as the version.
# ${PREFIX}/share has to be in the $XDG_DATA_DIRS seen by the
# xdg-desktop-portal service -- the service, not the compositor, since it is
# usually D-Bus-activated and need not inherit the session's environment -- or
# be the portal's own build-time datadir. The default /usr/local qualifies
# while $XDG_DATA_DIRS is unset or empty, as it then defaults to
# /usr/local/share/:/usr/share/; a prefix like /opt/hikari, or a service
# environment that sets the variable to something narrower, does not, and this
# file is then as good as absent.
#
# portals.conf(5) lists every directory searched and in what order. Read it
# before changing any of this: the first match wins, so a file under
# ~/.config/xdg-desktop-portal/ overrides this one entirely.

[preferred]
# Action purpose: Order of preference for any interface not named below. wlr is
# tried first because it is the only backend that can capture from a wlroots
# compositor; gtk then answers everything wlr does not implement -- file
# dialogs, print, settings, email -- which is most of them.
default=wlr;gtk

# Action purpose: Pin the two capture interfaces to wlr explicitly rather than
# leaving them to the fallback above. Both are the reason this file exists, and
# an explicit line means a future edit to `default` cannot quietly cost
# screen sharing again.
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
